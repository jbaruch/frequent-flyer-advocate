name: Tests

# Pre-merge gate. Runs the same .github/scripts/pre-publish-gate.sh that the publish
# workflow runs after merge, so "CI must pass before merging" (commit-conventions) is
# satisfied by the same script that guards the registry — one gate, two trigger points,
# no drift between them.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run the diagnostics and test gate
        run: bash .github/scripts/pre-publish-gate.sh
